name: Build PS2 Launcher PKG

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm python3 python3-pip curl

      - name: Download OpenOrbis Toolchain
        run: |
          curl -L -o oo-toolchain.tar.gz \
            "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz"
          mkdir -p $HOME/oo-toolchain
          tar -xzf oo-toolchain.tar.gz -C $HOME/oo-toolchain

      - name: Find toolchain root
        run: |
          TOOLCHAIN_ROOT=$(find $HOME/oo-toolchain -path "*/include/orbis/libkernel.h" -print -quit | sed 's|/include/orbis/libkernel.h||')
          if [ -z "$TOOLCHAIN_ROOT" ]; then
            echo "ERROR: Could not find orbis/libkernel.h in extracted toolchain!"
            find $HOME/oo-toolchain -type d | head -30
            exit 1
          fi
          echo "Found toolchain root: $TOOLCHAIN_ROOT"
          echo "OO_PS4_TOOLCHAIN=$TOOLCHAIN_ROOT" >> $GITHUB_ENV
          echo "$TOOLCHAIN_ROOT/bin/linux" >> $GITHUB_PATH

      - name: Patch make_fself.py for Python 3
        run: |
          python3 << 'PYEOF'
          import os
          path = os.path.join(os.environ['OO_PS4_TOOLCHAIN'], 'scripts', 'make_fself.py')
          with open(path, 'r') as f:
              content = f.read()
          
          # Fix bytes literals
          content = content.replace("MAGIC = '\\\\x7FELF'", "MAGIC = b'\\\\x7fELF'")
          content = content.replace("EMPTY_DIGEST = '\\\\0' * DIGEST_SIZE", "EMPTY_DIGEST = b'\\\\0' * DIGEST_SIZE")
          content = content.replace("EMPTY_SIGNATURE = '\\\\0' * SIGNATURE_SIZE", "EMPTY_SIGNATURE = b'\\\\0' * SIGNATURE_SIZE")
          
          # Fix hex decode (Python 2 -> 3)
          content = content.replace("val.decode('hex')", "bytes.fromhex(val)")
          
          # Fix xrange (Python 2 -> 3)
          content = content.replace("xrange", "range")
          
          # Fix invalid escape in regex
          content = content.replace("re.sub('\\s+', '', val)", "re.sub(r'\\s+', '', val)")
          
          with open(path, 'w') as f:
              f.write(content)
          print("Patched make_fself.py for Python 3")
          PYEOF

      - name: Build PKG
        run: make pkg

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps2-launcher
          path: "*.pkg"
