name: Build PS2 Launcher PKG

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PKG in OpenOrbis toolchain container
        run: |
          docker run --rm -w /workspace -v "${{ github.workspace }}":/workspace \
            openorbis/toolchain:latest \
            bash -c "make pkg"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps2-launcher
          path: "*.pkg"
