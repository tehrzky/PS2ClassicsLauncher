name: Build PS2 Launcher PKG

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld python3 python3-pip curl

      - name: Download OpenOrbis Toolchain
        run: |
          curl -L -o oo-toolchain.tar.gz \
            "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.2/v0.5.2.tar.gz"
          mkdir -p $HOME/oo-toolchain
          tar -xzf oo-toolchain.tar.gz -C $HOME/oo-toolchain --strip-components=1

      - name: Set environment
        run: |
          echo "OO_PS4_TOOLCHAIN=$HOME/oo-toolchain" >> $GITHUB_ENV
          echo "$HOME/oo-toolchain/bin/linux" >> $GITHUB_PATH

      - name: Build PKG
        run: make pkg

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps2-launcher
          path: "*.pkg"
