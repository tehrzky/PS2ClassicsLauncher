name: Build PS2 Launcher PKG

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm python3 python3-pip curl

      - name: Download OpenOrbis Toolchain
        run: |
          curl -L -o oo-toolchain.tar.gz \
            "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz"
          mkdir -p $HOME/oo-toolchain
          tar -xzf oo-toolchain.tar.gz -C $HOME/oo-toolchain

      - name: Find toolchain root
        run: |
          TOOLCHAIN_ROOT=$(find $HOME/oo-toolchain -path "*/include/orbis/libkernel.h" -print -quit | sed 's|/include/orbis/libkernel.h||')
          if [ -z "$TOOLCHAIN_ROOT" ]; then
            echo "ERROR: Could not find orbis/libkernel.h in extracted toolchain!"
            find $HOME/oo-toolchain -type d | head -30
            exit 1
          fi
          echo "Found toolchain root: $TOOLCHAIN_ROOT"
          echo "OO_PS4_TOOLCHAIN=$TOOLCHAIN_ROOT" >> $GITHUB_ENV
          echo "$TOOLCHAIN_ROOT/bin/linux" >> $GITHUB_PATH

      - name: Patch make_fself.py for Python 3
        run: |
          SCRIPT="$OO_PS4_TOOLCHAIN/scripts/make_fself.py"
          # Fix 1: bytes literals for magic and empty buffers
          sed -i "s/MAGIC = '\\\\x7FELF'/MAGIC = b'\\\\x7fELF'/g" "$SCRIPT"
          sed -i "s/EMPTY_DIGEST = '\\\\0' \\* DIGEST_SIZE/EMPTY_DIGEST = b'\\\\0' * DIGEST_SIZE/g" "$SCRIPT"
          sed -i "s/EMPTY_SIGNATURE = '\\\\0' \\* SIGNATURE_SIZE/EMPTY_SIGNATURE = b'\\\\0' * SIGNATURE_SIZE/g" "$SCRIPT"
          # Fix 2: hex decode (Python 2 -> 3)
          sed -i "s/val.decode('hex')/bytes.fromhex(val)/g" "$SCRIPT"
          # Fix 3: xrange -> range
          sed -i 's/xrange/range/g' "$SCRIPT"
          # Fix 4: invalid escape in regex
          sed -i "s/re.sub('\\\\s+', '', val)/re.sub(r'\\\\s+', '', val)/g" "$SCRIPT"
          echo "Patched make_fself.py"

      - name: Build PKG
        run: make pkg

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps2-launcher
          path: "*.pkg"
